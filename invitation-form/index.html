<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ENDRE: tittelen som vises i nettleserfanen -->
  <title>Du er invitert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #d9e4ee;
      --ink: #1d2b3f;
      --muted: #56657a;
      --paper: #ffffff;
      --marigold: #e3a13b;
      --marigold-dark: #c7861f;
      --line: #c5d2df;
      --error: #a82a20;
      --ok: #2e6b4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--sky);
      color: var(--ink);
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 3.5rem 1.25rem 4rem;
    }

    /* Invitasjonen */
    .intro { margin-bottom: 2.5rem; }
    .intro p.lead {
      margin: 0 0 .5rem;
      color: var(--muted);
      font-weight: 500;
    }
    h1 {
      font-family: "Young Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 9vw, 3.75rem);
      line-height: 1.05;
      margin: 0 0 1.5rem;
      letter-spacing: -.01em;
    }
    h1::after {
      content: "";
      display: block;
      width: 4.5rem;
      height: .35rem;
      margin-top: 1.1rem;
      border-radius: 1rem;
      background: var(--marigold);
    }
    .details {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .35rem 1.25rem;
      margin: 0 0 1.25rem;
    }
    .details dt { color: var(--muted); }
    .details dd { margin: 0; font-weight: 600; }
    .intro .note { margin: 0; }

    /* Skjemaet */
    .panel {
      background: var(--paper);
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 1px 0 var(--line);
    }
    h2 {
      font-family: "Young Serif", Georgia, serif;
      font-weight: 400;
      font-size: 1.6rem;
      margin: 0 0 1.5rem;
    }
    .field { margin-bottom: 1.25rem; }
    label, legend {
      display: block;
      font-weight: 600;
      margin-bottom: .4rem;
    }
    .hint { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="email"], input[type="number"], textarea {
      width: 100%;
      font: inherit;
      color: inherit;
      padding: .7rem .85rem;
      border: 1.5px solid var(--line);
      border-radius: .6rem;
      background: #fbfcfe;
    }
    input[type="number"] { width: 7rem; }
    textarea { resize: vertical; min-height: 5.5rem; }
    input:focus-visible, textarea:focus-visible, button:focus-visible, .choice input:focus-visible + span {
      outline: 3px solid var(--marigold);
      outline-offset: 2px;
      border-color: var(--ink);
    }

    fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: block;
      text-align: center;
      padding: .8rem .5rem;
      border: 1.5px solid var(--line);
      border-radius: .6rem;
      cursor: pointer;
      font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .choice input:checked + span {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    button[type="submit"] {
      width: 100%;
      margin-top: .5rem;
      font: inherit;
      font-weight: 600;
      font-size: 1.1rem;
      padding: .9rem 1rem;
      border: 0;
      border-radius: .6rem;
      background: var(--marigold);
      color: var(--ink);
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--marigold-dark); }
    button[disabled] { opacity: .6; cursor: progress; }

    .status { margin: 1rem 0 0; min-height: 1.5em; }
    .status.error { color: var(--error); font-weight: 500; }

    .thanks { text-align: center; padding: 1rem 0; }
    .thanks h2 { margin-bottom: .5rem; }
    .thanks p { margin: 0; color: var(--muted); }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <!-- ENDRE: alt inni <section class="intro"> er teksten på invitasjonen -->
    <section class="intro">
      <p class="lead">Du er invitert til</p>
      <h1>Navn på arrangementet</h1>
      <dl class="details">
        <dt>Når</dt>
        <dd>Lørdag 17. oktober kl. 18:00</dd>
        <dt>Hvor</dt>
        <dd>Adresse eller sted</dd>
        <dt>Svar innen</dt>
        <dd>10. oktober</dd>
      </dl>
      <p class="note">Skriv en kort hilsen til gjestene her: hva som skjer, hva de bør ta med, og hvem de kan kontakte.</p>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <form id="rsvp-form" novalidate>
        <h2 id="form-title">Svar på invitasjonen</h2>

        <div class="field">
          <label for="name">Navn</label>
          <input type="text" id="name" name="name" maxlength="100" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">E-post <span class="hint">(valgfritt)</span></label>
          <input type="email" id="email" name="email" maxlength="254" autocomplete="email">
        </div>

        <fieldset>
          <legend>Kommer du?</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="attending" value="yes" required><span>Ja, jeg kommer</span></label>
            <label class="choice"><input type="radio" name="attending" value="no"><span>Nei, dessverre</span></label>
          </div>
        </fieldset>

        <div id="coming-fields" hidden>
          <div class="field">
            <label for="guests">Antall personer <span class="hint">(inkludert deg)</span></label>
            <input type="number" id="guests" name="guests" min="1" max="10" value="1" inputmode="numeric">
          </div>
          <div class="field">
            <label for="allergies">Allergier eller matpreferanser <span class="hint">(valgfritt)</span></label>
            <input type="text" id="allergies" name="allergies" maxlength="500">
          </div>
        </div>

        <div class="field">
          <label for="message">Hilsen <span class="hint">(valgfritt)</span></label>
          <textarea id="message" name="message" maxlength="1000"></textarea>
        </div>

        <!-- Felle for spam-roboter. Mennesker ser aldri dette feltet. -->
        <div class="honeypot" aria-hidden="true">
          <label for="website">Nettside</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" id="submit">Send svar</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <div class="thanks" id="thanks" hidden tabindex="-1">
        <h2 id="thanks-title">Svaret ditt er sendt</h2>
        <p id="thanks-text"></p>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("rsvp-form");
    const comingFields = document.getElementById("coming-fields");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit");

    // Vis antall personer og allergier bare når gjesten svarer ja
    form.querySelectorAll('input[name="attending"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        comingFields.hidden = form.attending.value !== "yes";
      });
    });

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = "status error";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = form.name.value.trim();
      const attendingValue = form.attending.value;

      if (!name) { showError("Skriv inn navnet ditt."); form.name.focus(); return; }
      if (!attendingValue) { showError("Velg om du kommer eller ikke."); return; }
      if (form.email.value && !form.email.checkValidity()) {
        showError("E-postadressen ser ikke riktig ut. Sjekk den, eller la feltet stå tomt.");
        form.email.focus();
        return;
      }

      const attending = attendingValue === "yes";
      const payload = {
        name,
        email: form.email.value.trim(),
        attending,
        guests: attending ? Number(form.guests.value) : 0,
        allergies: attending ? form.allergies.value.trim() : "",
        message: form.message.value.trim(),
        website: form.website.value
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Sender …";
      statusEl.textContent = "";
      statusEl.className = "status";

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch("/api/rsvp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Svaret ble ikke sendt. Prøv igjen om litt.");

        form.hidden = true;
        const thanks = document.getElementById("thanks");
        document.getElementById("thanks-text").textContent = attending
          ? "Takk, " + name + "! Vi gleder oss til å se deg."
          : "Takk for at du svarte, " + name + ". Vi kommer til å savne deg.";
        thanks.hidden = false;
        thanks.focus();
      } catch (err) {
        showError(err.name === "AbortError"
          ? "Det tok for lang tid å sende svaret. Sjekk nettet og prøv igjen."
          : err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Send svar";
      } finally {
        clearTimeout(timeout);
      }
    });
  </script>
</body>
</html>
